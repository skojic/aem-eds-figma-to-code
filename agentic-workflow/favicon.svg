<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Agentic workflow">
  <defs>
    <linearGradient id="g" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff80bf" />
      <stop offset=".55" stop-color="#ffca80" />
      <stop offset="1" stop-color="#8aff80" />
    </linearGradient>
  </defs>

  <!-- Canvas matches the page background so the mark reads on light and dark tabs -->
  <rect width="32" height="32" rx="7" fill="#08070b" />

  <g fill="url(#g)">
    <!-- Eight teeth, one rounded tooth rotated around the centre -->
    <g>
      <rect x="13.6" y="1.9" width="4.8" height="7" rx="1.8" />
      <rect x="13.6" y="1.9" width="4.8" height="7" rx="1.8" transform="rotate(45 16 16)" />
      <rect x="13.6" y="1.9" width="4.8" height="7" rx="1.8" transform="rotate(90 16 16)" />
      <rect x="13.6" y="1.9" width="4.8" height="7" rx="1.8" transform="rotate(135 16 16)" />
      <rect x="13.6" y="1.9" width="4.8" height="7" rx="1.8" transform="rotate(180 16 16)" />
      <rect x="13.6" y="1.9" width="4.8" height="7" rx="1.8" transform="rotate(225 16 16)" />
      <rect x="13.6" y="1.9" width="4.8" height="7" rx="1.8" transform="rotate(270 16 16)" />
      <rect x="13.6" y="1.9" width="4.8" height="7" rx="1.8" transform="rotate(315 16 16)" />
    </g>
    <!-- Body with the hub punched out, so the gear stays legible at 16px -->
    <path fill-rule="evenodd"
          d="M16 5.6a10.4 10.4 0 1 1 0 20.8 10.4 10.4 0 0 1 0-20.8zm0 6.6a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6z" />
  </g>
</svg>
